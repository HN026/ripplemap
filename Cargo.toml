[package]
name = "ripplemap"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local library impact and repository compatibility evidence"

[dependencies]
anyhow = "1"
node-semver = { version = "2.2", default-features = false }
clap = { version = "4.6", features = ["derive"] }
prost = "0.14"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting"] }

tempfile = "3"
